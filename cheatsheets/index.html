<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheatsheets</title>
<style>
  :root {
    --bg: #1a1b26;
    --panel: #24283b;
    --fg: #c0caf5;
    --muted: #7a88cf;
    --accent: #7aa2f7;
    --border: #414868;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fafafa;
      --panel: #ffffff;
      --fg: #1a1a1a;
      --muted: #555;
      --accent: #2a5db0;
      --border: #d0d0d0;
    }
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main {
    max-width: 640px;
    width: 100%;
  }
  h1 { color: var(--accent); margin-bottom: 0.2rem; }
  p { color: var(--muted); margin-top: 0; }
  ul { list-style: none; padding: 0; }
  li {
    margin: 0.6rem 0;
  }
  a.card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem 1.2rem;
    color: var(--fg);
    text-decoration: none;
    transition: border-color 0.15s;
  }
  a.card:hover { border-color: var(--accent); }
  a.card strong { color: var(--accent); display: block; margin-bottom: 0.2rem; }
  a.card span { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Cheatsheets</h1>
  <p>Single-page quick references.</p>
  <ul>
    <li><a class="card" href="zig/"><strong>Zig 0.16.0</strong><span>syntax, allocators, build system, std library</span></a></li>
    <li><a class="card" href="rust/"><strong>Rust (stable)</strong><span>ownership, traits, async, cargo, std library</span></a></li>
  </ul>
</main>
</body>
</html>
